apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform
  labels:
    env: test
    scenario: istio
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
      env: test
      scenario: istio
      tier: api
  template:
    metadata:
      labels:
        app: platform-api
        env: test
        scenario: istio
        tier: api
    spec:
      containers:
        - name: platform-api
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=platform api"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform
  labels:
    env: test
    scenario: istio
    tier: api
spec:
  selector:
    app: platform-api
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
  labels:
    env: test
    scenario: istio
data:
  app.properties: |
    log.level=info
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secret
  namespace: platform
  labels:
    env: test
    scenario: istio
type: Opaque
stringData:
  api-token: test-token
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-deny-egress
  namespace: platform
  labels:
    env: test
    scenario: istio
spec:
  podSelector:
    matchLabels:
      app: platform-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-api
  namespace: platform
  labels:
    env: test
    scenario: istio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: apps
  labels:
    env: test
    scenario: istio
    tier: api
    domain: users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-api
      env: test
      scenario: istio
      tier: api
      domain: users
  template:
    metadata:
      labels:
        app: users-api
        env: test
        scenario: istio
        tier: api
        domain: users
    spec:
      containers:
        - name: users-api
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=users api"
          ports:
            - containerPort: 5678
