apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: apps
  labels:
    env: test
    scenario: complex
    tier: api
    domain: users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-api
      env: test
      scenario: complex
      tier: api
      domain: users
  template:
    metadata:
      labels:
        app: users-api
        env: test
        scenario: complex
        tier: api
        domain: users
    spec:
      containers:
        - name: users-api
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=users api"
          ports:
            - containerPort: 5678
---
