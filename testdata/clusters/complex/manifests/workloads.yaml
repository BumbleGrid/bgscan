apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: apps
  labels:
    env: test
    scenario: complex
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
      env: test
      scenario: complex
      tier: web
  template:
    metadata:
      labels:
        app: web-frontend
        env: test
        scenario: complex
        tier: web
    spec:
      containers:
        - name: web-frontend
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: apps
  labels:
    env: test
    scenario: complex
    tier: api
    domain: users
spec:
  selector:
    app: users-api
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Service
