---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: apps
  labels:
    env: test
    scenario: complex
    tier: web
spec:
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-reconciliation
  namespace: jobs
  labels:
    env: test
    scenario: complex
    tier: batch
    domain: billing
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            env: test
            scenario: complex
            tier: batch
            domain: billing
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconcile
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - "echo reconcile run at $(date)"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: data
  labels:
    env: test
    scenario: complex
    tier: data
    domain: orders
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
      env: test
      scenario: complex
      tier: data
      domain: orders
  template:
    metadata:
      labels:
        app: orders-db
        env: test
        scenario: complex
        tier: data
        domain: orders
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: app
            - name: POSTGRES_DB
              value: app
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: dbdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: dbdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: data
  labels:
    env: test
    scenario: complex
    tier: data
    domain: orders
spec:
  selector:
    app: orders-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: data
  labels:
    env: test
    scenario: complex
    tier: cache
spec:
  serviceName: cache
  replicas: 1
  selector:
    matchLabels:
      app: cache
      env: test
      scenario: complex
      tier: cache
  template:
    metadata:
      labels:
        app: cache
        env: test
        scenario: complex
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: cachedata
              mountPath: /data
      volumes:
        - name: cachedata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: data
  labels:
    env: test
    scenario: complex
    tier: cache
spec:
  selector:
    app: cache
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-gateway
  namespace: apps
  labels:
    env: test
    scenario: complex
    tier: gateway
spec:
  rules:
    - host: app.local
      http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: users-api
                port:
                  number: 80
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: billing-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend
                port:
                  number: 80
