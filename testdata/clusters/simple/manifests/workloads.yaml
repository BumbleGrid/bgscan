apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: apps
  labels:
    env: test
    scenario: simple
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      env: test
      scenario: simple
      tier: api
  template:
    metadata:
      labels:
        app: api
        env: test
        scenario: simple
        tier: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=api service"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: apps
  labels:
    env: test
    scenario: simple
    tier: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 5678
---
