apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: data
  labels:
    env: test
    scenario: simple
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
      env: test
      scenario: simple
      tier: data
  template:
    metadata:
      labels:
        app: database
        env: test
        scenario: simple
        tier: data
    spec:
      containers:
        - name: database
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: app
            - name: POSTGRES_DB
              value: app
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: data
  labels:
    env: test
    scenario: simple
    tier: data
spec:
  selector:
    app: database
  ports:
    - port: 5432
      targetPort: 5432
