apiVersion: v1
kind: Secret
metadata:
  name: bgscan-config
  labels:
    app.kubernetes.io/name: bgscan
    app.kubernetes.io/component: scanner
type: Opaque
stringData:
  bgscan.yaml: |
    # Replace with SaaS-generated bgscan.yaml before applying, or create the Secret with:
    # kubectl create secret generic bgscan-config --from-file=bgscan.yaml=./bgscan.yaml -n bumblegrid-system --dry-run=client -o yaml | kubectl apply -f -
    org: "REPLACE_ME"
    document: "REPLACE_ME"
    cluster:
      name: "REPLACE_ME"
      slug: "REPLACE_ME"
      environment: "production"
      namespaces: []
    kubeconfig: ""
    context: ""
    namespaces: []
    extractor_version: ""
    output: "push"
    endpoint: "https://api.bumblegrid.tech"
    api_key: "bg_sk_REPLACE_ME"
