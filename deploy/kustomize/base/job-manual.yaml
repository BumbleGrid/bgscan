apiVersion: batch/v1
kind: Job
metadata:
  name: bgscan-first-run
  labels:
    app.kubernetes.io/name: bgscan
    app.kubernetes.io/component: scanner
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bgscan
        app.kubernetes.io/component: scanner
    spec:
      serviceAccountName: bgscan
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bgscan
          image: bumblegrid/bgscan:v1.0.0-beta.8
          imagePullPolicy: IfNotPresent
          command:
            - bgscan
            - run
            - --config
            - /etc/bgscan/bgscan.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bgscan-config
              mountPath: /etc/bgscan
              readOnly: true
      volumes:
        - name: bgscan-config
          secret:
            secretName: bgscan-config
