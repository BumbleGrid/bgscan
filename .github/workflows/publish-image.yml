name: Publish container image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable version tag (e.g. 0.2.0)
        required: true
        type: string
      also_tag_latest:
        description: Also push the latest tag
        required: false
        type: boolean
        default: false

env:
  IMAGE: bumblegrid/bgscan

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GITHUB_TOKEN: ${{ secrets.GO_MODULE_GITHUB_TOKEN != '' && secrets.GO_MODULE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=1

          docker build \
            --secret id=github_token,env=GITHUB_TOKEN \
            --build-arg VERSION="${IMAGE_TAG}" \
            -t "${IMAGE}:${IMAGE_TAG}" \
            .

          docker push "${IMAGE}:${IMAGE_TAG}"

          if [ "${{ inputs.also_tag_latest }}" = "true" ]; then
            docker tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
