# Sample bgscan configuration. Copy to bgconfig.yaml beside the bgscan binary,
# or pass an explicit path: bgscan --config /path/to/bgconfig.yaml
#
# All keys below are required when using a config file (empty values are allowed
# where noted), except whole_document which may be omitted (defaults to false).

# Path to kubeconfig, or "" for default discovery (in-cluster, then ~/.kube/config).
kubeconfig: " ~/.kube/config"

# Kubeconfig context name, or "" for current-context.
context: ""

# Namespaces to scan; [] means all namespaces you can access.
namespaces: []

# Namespaces to exclude after the allowlist above. When this key is omitted,
# bgscan uses the built-in defaults in config/default_scan_filters.yaml.
# Set ignore_namespaces: [] to scan every accessible namespace (including platform NS).
# ignore_namespaces:
#   - kube-system
#   - bumblegrid-system

# Workload deny patterns as namespace/kind/name globs (Floor 0 kinds only).
# When omitted, no workloads are filtered. Kind segment: deployments, statefulsets,
# daemonsets, cronjobs, jobs, services, ingresses.
# ignore_workloads:
#   - "payments/deployments/eppo*"
#   - "apps/*/legacy-*"

# BGSpec JSON output path; "-" is stdout.
output: "-"

# Stamped into node/edge meta.extractorVersion in the emitted document.
extractor_version: "0.1.0"

# When true, emit a full BGSpec root document (bgspec, document, floors 0–3).
# When false (default), emit floor 0 only once that path is implemented.
whole_document: false

# Node layout when whole_document is true: "default" (auto grid in styleMap) or
# "none" (omit styleMap). Empty means "none". Requires whole_document: true when
# set to "default".
# auto_arrangement: default

# Push mode — uncomment to send the extraction to a BumbleGrid backend.
# output: push
# endpoint: "https://api.bumblegrid.tech"
# org: "paperpath-inc"
# document: "payments-domain-infra-map"
# cluster: "prod-eu-west-1"
# api_key: "bg_sk_REPLACE_ME"
# local_validate: true
# local_output: "/output/bgdoc.json"   # optional; save a copy while pushing
# idempotency: ""        # blank → derived from sha256 of the payload
